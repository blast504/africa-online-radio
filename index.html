
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Africa Online Radio</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .station {
            background: white;
            color: black;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .station h2 {
            margin-top: 0;
        }

        .live {
            color: green;
            font-weight: bold;
        }

        audio {
            display: block !important;
            width: 100% !important;
            height: 50px !important;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>🌍 Africa Online Radio</h1>


    <!-- SKYZ METRO FM -->

    <div class="station">

        <h2>Skyz Metro FM</h2>

        <p>Bulawayo, Zimbabwe</p>

        <p class="live">● LIVE</p>

        <audio controls preload="none" playsinline>
            <source
                src="https://stream.zeno.fm/2634b6n4qy8uv"
                type="audio/mpeg">

            Your browser does not support audio.
        </audio>

    </div>


    <!-- STAR FM -->

    <div class="station">

        <h2>Star FM</h2>

        <p>Zimbabwe</p>

        <p class="live">● LIVE</p>

        <audio controls preload="none" playsinline>
            <source
                src="https://edge.iono.fm/xice/159_medium.aac"
                type="audio/aac">

            Your browser does not support audio.
        </audio>

    </div>


    <!-- DIAMOND FM -->

    <div class="station">

        <h2>Diamond FM 103.8</h2>

        <p>Mutare, Zimbabwe</p>

        <p class="live">● LIVE</p>

        <audio controls preload="none" playsinline>

                src="https://edge.iono.fm/xice/160_medium.aac"
                type="audio/aac">

            Your browser does not support audio.
        </audio>

    </div>


    <!-- ZIFM -->

    <div class="station">

        <h2>ZiFM Stereo</h2>

        <p>Zimbabwe</p>

        <p class="live">● LIVE</p>

        <audio controls preload="none" playsinline>
            <source
                src="https://edge.iono.fm/xice/134_medium.aac"
                type="audio/aac">

            Your browser does not support audio.
        </audio>

    </div>


    <!-- ZODIAK -->

    <div class="station">

        <h2>Zodiak</h2>

        <p>Malawi</p>

        <p class="live">● LIVE</p>

        <audio controls preload="none" playsinline>
            <source
                src="https://ice31.securenetsystems.net/0079"
                type="audio/mpeg">

            Your browser does not support audio.
        </audio>

    </div>


</body>
</html>
